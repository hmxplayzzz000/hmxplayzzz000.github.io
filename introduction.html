<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HerSafe Introduction 💜</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #16001f,
            #4b0875,
            #ff4fc3
        );

    color: white;
    text-align: center;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    background: rgba(255, 105, 220, 0.25);
    border-radius: 50%;
    filter: blur(100px);
    top: -150px;
    left: -150px;
    animation: backgroundGlow 5s infinite alternate;
    pointer-events: none;
}

body::after {
    content: "";
    position: fixed;
    width: 450px;
    height: 450px;
    background: rgba(170, 80, 255, 0.25);
    border-radius: 50%;
    filter: blur(100px);
    bottom: -150px;
    right: -150px;
    animation: backgroundGlow 6s infinite alternate-reverse;
    pointer-events: none;
}

.container {
    width: 90%;
    max-width: 900px;
    margin: 0 auto;
    padding: 50px 20px 70px;
    position: relative;
    z-index: 2;
}

.title {
    font-size: clamp(45px, 10vw, 75px);
    font-weight: bold;
    margin-bottom: 10px;

    text-shadow:
        0 0 10px #ff8de1,
        0 0 25px #ff4fc3,
        0 0 45px #b700ff;

    animation: titleGlow 2.5s infinite alternate;
}

.intro-image {
    width: 100%;
    max-width: 650px;
    display: block;
    margin: 25px auto 30px;

    border-radius: 25px;

    box-shadow:
        0 0 20px rgba(255,255,255,0.3),
        0 0 45px rgba(255,79,195,0.7);

    animation: imageEnter 1.3s ease forwards;
}

.slogan {
    font-size: clamp(20px, 4vw, 30px);
    font-weight: bold;
    line-height: 1.4;

    max-width: 750px;
    margin: 20px auto 40px;

    min-height: 80px;

    text-shadow:
        0 0 10px #ff8de1,
        0 0 25px #ff4fc3;
}

.quiz-card {
    max-width: 750px;
    margin: 0 auto;
    padding: 30px 25px;

    border-radius: 28px;

    background: rgba(20,0,30,0.65);

    border:
        1px solid rgba(255,255,255,0.15);

    box-shadow:
        0 0 30px rgba(255,79,195,0.25);

    backdrop-filter: blur(15px);
}

.progress-container {
    width: 100%;
    height: 10px;

    background: rgba(255,255,255,0.12);

    border-radius: 20px;
    overflow: hidden;

    margin-bottom: 25px;
}

.progress-bar {
    height: 100%;
    width: 0%;

    background:
        linear-gradient(
            90deg,
            #ff4fc3,
            #b700ff
        );

    border-radius: 20px;

    transition: width 0.4s ease;

    box-shadow:
        0 0 15px #ff4fc3;
}

.question-number {
    font-size: 14px;
    opacity: 0.7;
    margin-bottom: 10px;
}

.question {
    font-size: clamp(21px, 4vw, 29px);
    font-weight: bold;
    line-height: 1.4;
    margin-bottom: 25px;
}

.answers {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.answer {
    width: 100%;
    padding: 16px;

    border-radius: 18px;

    border:
        1px solid rgba(255,255,255,0.15);

    background:
        rgba(255,255,255,0.08);

    color: white;

    font-size: 16px;

    cursor: pointer;

    transition: 0.3s;
}

.answer:hover {
    background:
        rgba(255,79,195,0.25);

    transform: translateY(-2px);

    box-shadow:
        0 0 15px rgba(255,79,195,0.3);
}

.answer.correct {
    background:
        rgba(60,220,130,0.25);

    border-color:
        #6dffab;
}

.answer.wrong {
    background:
        rgba(255,60,100,0.25);

    border-color:
        #ff6688;
}

.result {
    display: none;

    max-width: 750px;

    margin: 30px auto;

    padding: 30px;

    border-radius: 28px;

    background:
        rgba(20,0,30,0.7);

    border:
        1px solid rgba(255,255,255,0.15);

    box-shadow:
        0 0 30px rgba(255,79,195,0.25);

    backdrop-filter: blur(15px);
}

.result-title {
    font-size: 32px;
    font-weight: bold;

    color: #ff9be4;

    text-shadow:
        0 0 15px #ff4fc3;

    margin-bottom: 15px;
}

.result-score {
    font-size: 50px;
    font-weight: bold;

    margin: 15px 0;

    color: #ffb8ed;

    text-shadow:
        0 0 20px #ff4fc3;
}

.wrong-review {
    display: none;
    margin-top: 25px;
    text-align: left;
}

.wrong-item {
    padding: 15px;
    margin: 12px 0;

    border-radius: 18px;

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid rgba(255,255,255,0.1);
}

.wrong-item strong {
    color: #ff9be4;
}

.main-button {
    border: none;

    border-radius: 30px;

    padding: 15px 28px;

    background:
        linear-gradient(
            135deg,
            #ff4fc3,
            #9b35ff
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    margin-top: 20px;

    box-shadow:
        0 0 15px #ff4fc3,
        0 0 30px #b700ff;

    transition: 0.3s;
}

.main-button:hover {
    transform: scale(1.05);

    box-shadow:
        0 0 25px #ff8de1,
        0 0 45px #b700ff;
}

.main-button:disabled {
    opacity: 0.6;
    cursor: wait;
    transform: none;
}

/* ACCOUNT SECTION */

.account-section {
    max-width: 600px;

    margin: 30px auto 0;

    padding: 22px;

    border-radius: 22px;

    background:
        rgba(255,255,255,0.06);

    border:
        1px solid rgba(255,255,255,0.12);

    box-shadow:
        0 0 20px rgba(255,79,195,0.12);
}

.account-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 7px;
}

.account-text {
    font-size: 14px;
    opacity: 0.75;
    line-height: 1.5;
    margin-bottom: 15px;
}

.account-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
}

.account-button {
    border:
        1px solid rgba(255,255,255,0.2);

    border-radius: 25px;

    padding: 12px 22px;

    background:
        rgba(255,79,195,0.15);

    color: white;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}

.account-button:hover {
    background:
        rgba(255,79,195,0.3);

    transform: scale(1.04);

    box-shadow:
        0 0 15px rgba(255,79,195,0.4);
}

.account-button:disabled {
    opacity: 0.6;
    cursor: wait;
    transform: none;
}

.account-status {
    min-height: 22px;
    margin-top: 14px;
    font-size: 14px;
    line-height: 1.5;
}

#clerkMount {
    display: none;
    margin-top: 18px;
    justify-content: center;
}

#clerkMount.show {
    display: flex;
}

/* ANIMATIONS */

@keyframes backgroundGlow {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.3);
    }
}

@keyframes titleGlow {
    from {
        text-shadow:
            0 0 10px #ff8de1,
            0 0 25px #ff4fc3;
    }

    to {
        text-shadow:
            0 0 20px #ffb8ed,
            0 0 45px #ff4fc3,
            0 0 70px #b700ff;
    }
}

@keyframes imageEnter {
    from {
        opacity: 0;

        transform:
            translateY(40px)
            scale(0.95);

        filter: blur(6px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);

        filter: blur(0);
    }
}

@media (max-width: 600px) {

    .container {
        padding:
            40px 15px 60px;
    }

    .quiz-card {
        padding:
            25px 18px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="title">
        HerSafe 💜
    </div>

    <img
        class="intro-image"
        src="https://i.ibb.co/PGWJkKtV/34e700a0e1ee6be201f00704456bd3bb.jpg"
        alt="Football injury"
    >

    <div
        class="slogan"
        id="slogan">
    </div>

    <div
        class="quiz-card"
        id="quizCard">

        <div class="progress-container">

            <div
                class="progress-bar"
                id="progressBar">
            </div>

        </div>

        <div
            class="question-number"
            id="questionNumber">
        </div>

        <div
            class="question"
            id="question">
        </div>

        <div
            class="answers"
            id="answers">
        </div>

    </div>

    <div
        class="result"
        id="result">

        <div class="result-title">
            Quiz Complete! 💜
        </div>

        <div
            class="result-score"
            id="resultScore">
        </div>

        <div id="resultMessage">
        </div>

        <button
            class="main-button"
            onclick="showWrongAnswers()">

            See what answers you got wrong 💜

        </button>

        <div
            class="wrong-review"
            id="wrongReview">
        </div>

        <button
            class="main-button"
            onclick="goHome()">

            Continue to HerSafe 🏠

        </button>

    </div>

    <div
        class="account-section"
        id="accountSection">

        <div
            class="account-title"
            id="accountTitle">

            Already have a HerSafe Pass? 💜

        </div>

        <div
            class="account-text"
            id="accountText">

            Log in to save your quiz progress online
            and keep it with your account.

        </div>

        <div class="account-buttons">

            <button
                class="account-button"
                id="loginButton"
                type="button">

                👤 Log In

            </button>

            <button
                class="account-button"
                id="createButton"
                type="button">

                💜 Create HerSafe Pass

            </button>

        </div>

        <div id="clerkMount"></div>

        <div
            class="account-status"
            id="accountStatus">
        </div>

    </div>

</div>

<script src="hersafe-account.js"></script>

<script>

/* =========================================
   SLOGAN
========================================= */

const sloganText =
    "Helping people understand, prevent and protect against leg injuries.";

let sloganIndex = 0;

function typeSlogan() {

    if (
        sloganIndex <
        sloganText.length
    ) {

        document.getElementById(
            "slogan"
        ).textContent +=
            sloganText.charAt(
                sloganIndex
            );

        sloganIndex++;

        setTimeout(
            typeSlogan,
            45
        );

    }

}

typeSlogan();

/* =========================================
   QUESTIONS
========================================= */

const questions = [

    {
        question:
            "What should you do if you feel pain in your knee during football?",

        answers: [
            "Keep playing and ignore it.",
            "Stop and tell a responsible adult or coach.",
            "Run faster to see if it gets better.",
            "Wait until the next day before telling anyone."
        ],

        correct: 1
    },

    {
        question:
            "What can a proper warm-up help prepare?",

        answers: [
            "Your phone and equipment.",
            "Only your lungs.",
            "Your muscles and joints.",
            "Only your feet."
        ],

        correct: 2
    },

    {
        question:
            "Which can be a sign of a knee injury?",

        answers: [
            "Pain or swelling.",
            "Feeling hungry.",
            "Having clean football boots.",
            "Being thirsty before training."
        ],

        correct: 0
    },

    {
        question:
            "Why is wearing suitable football footwear important?",

        answers: [
            "It makes you run automatically.",
            "It makes your feet bigger.",
            "It can help provide grip and support.",
            "It prevents every possible injury."
        ],

        correct: 2
    },

    {
        question:
            "What is important after an injury?",

        answers: [
            "Ignore the injury.",
            "Get appropriate help and follow advice.",
            "Immediately return to full training.",
            "Hide the injury from your coach."
        ],

        correct: 1
    }

];

let currentQuestion = 0;

let score = 0;

let wrongAnswers = [];

let savedAnswers = {};

/* =========================================
   LOAD QUESTION
========================================= */

function loadQuestion() {

    const question =
        questions[currentQuestion];

    document.getElementById(
        "questionNumber"
    ).textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;

    document.getElementById(
        "question"
    ).textContent =
        question.question;

    const answers =
        document.getElementById(
            "answers"
        );

    answers.innerHTML = "";

    question.answers.forEach(
        function(answer, index) {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "answer";

            button.textContent =
                answer;

            button.onclick =
                function() {
                    selectAnswer(index);
                };

            answers.appendChild(
                button
            );

        }
    );

    const progress =
        (
            currentQuestion /
            questions.length
        ) * 100;

    document.getElementById(
        "progressBar"
    ).style.width =
        progress + "%";

}

/* =========================================
   SELECT ANSWER
========================================= */

async function selectAnswer(index) {

    const question =
        questions[currentQuestion];

    const buttons =
        document.querySelectorAll(
            ".answer"
        );

    buttons.forEach(
        function(button) {
            button.disabled = true;
        }
    );

    savedAnswers[currentQuestion] = {

        question:
            question.question,

        selected:
            index,

        selectedText:
            question.answers[index],

        correct:
            question.correct,

        correctText:
            question.answers[
                question.correct
            ]

    };

    if (
        index ===
        question.correct
    ) {

        buttons[index].classList.add(
            "correct"
        );

        score++;

    } else {

        buttons[index].classList.add(
            "wrong"
        );

        buttons[
            question.correct
        ].classList.add(
            "correct"
        );

        wrongAnswers.push({

            question:
                question.question,

            chosen:
                question.answers[index],

            correct:
                question.answers[
                    question.correct
                ]

        });

    }

    try {

        const user =
            await window.HerSafe.currentUser();

        if (user) {

            await window.HerSafe.saveProgress({

                answers:
                    savedAnswers,

                completed:
                    false

            });

        }

    } catch (error) {

        console.error(
            "Could not save quiz progress:",
            error
        );

    }

    setTimeout(
        function() {

            currentQuestion++;

            if (
                currentQuestion <
                questions.length
            ) {

                loadQuestion();

            } else {

                finishQuiz();

            }

        },
        900
    );

}

/* =========================================
   FINISH QUIZ
========================================= */

async function finishQuiz() {

    const percentage =
        Math.round(
            (
                score /
                questions.length
            ) * 100
        );

    savedAnswers._score =
        percentage;

    savedAnswers._total =
        questions.length;

    savedAnswers._correct =
        score;

    try {

        const user =
            await window.HerSafe.currentUser();

        if (user) {

            await window.HerSafe.saveProgress({

                answers:
                    savedAnswers,

                completed:
                    true,

                completedCount:
                    score,

                total:
                    questions.length

            });

        }

    } catch (error) {

        console.error(
            "Could not save completed quiz:",
            error
        );

    }

    localStorage.setItem(
        "herSafeQuizCompleted",
        "true"
    );

    localStorage.setItem(
        "herSafeQuizScore",
        percentage
    );

    document.getElementById(
        "quizCard"
    ).style.display =
        "none";

    document.getElementById(
        "accountSection"
    ).style.display =
        "none";

    document.getElementById(
        "result"
    ).style.display =
        "block";

    document.getElementById(
        "resultScore"
    ).textContent =
        percentage + "%";

    document.getElementById(
        "resultMessage"
    ).textContent =
        "You got " +
        score +
        " out of " +
        questions.length +
        " questions correct! 💜";

}

/* =========================================
   WRONG ANSWERS
========================================= */

window.showWrongAnswers = function() {

    const review =
        document.getElementById(
            "wrongReview"
        );

    review.style.display =
        "block";

    if (
        wrongAnswers.length === 0
    ) {

        review.innerHTML =
            "<div class='wrong-item'>" +
            "🎉 You didn't get any answers wrong! Great job! 💜" +
            "</div>";

        return;

    }

    review.innerHTML =
        "<h3>Answers to look over:</h3>";

    wrongAnswers.forEach(
        function(item) {

            review.innerHTML +=

                "<div class='wrong-item'>" +

                "<strong>" +
                item.question +
                "</strong><br><br>" +

                "Your answer: " +
                item.chosen +
                "<br>" +

                "Correct answer: " +
                item.correct +

                "</div>";

        }
    );

};

/* =========================================
   GO HOME
========================================= */

window.goHome = function() {

    window.location.href =
        "homepage101.html";

};

/* =========================================
   ACCOUNT BUTTONS
========================================= */

const accountStatus =
    document.getElementById("accountStatus");

const loginButton =
    document.getElementById("loginButton");

const createButton =
    document.getElementById("createButton");

const clerkMount =
    document.getElementById("clerkMount");

const accountTitle =
    document.getElementById("accountTitle");

const accountText =
    document.getElementById("accountText");

function showAccountStatus(message, isError) {

    accountStatus.textContent = message;

    accountStatus.style.color =
        isError
            ? "#ffb6c1"
            : "#a9ffd7";

}

loginButton.addEventListener(
    "click",
    function () {

        window.location.href =
            "managehersafepass.html?mode=login";

    }
);

createButton.addEventListener(
    "click",
    function () {

        window.location.href =
            "managehersafepass.html?mode=signup";

    }
);

/* =========================================
   START QUIZ
========================================= */

loadQuestion();

</script>

</body>
</html>
