<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HerSafe Introduction 💜</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 40px 15px 70px;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    overflow-x: hidden;
    background:
        linear-gradient(
            135deg,
            #16001f,
            #4b0875,
            #ff4fc3
        );
}

body::before,
body::after {
    content: "";
    position: fixed;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
    z-index: -1;
}

body::before {
    top: -160px;
    left: -160px;
    background: rgba(255, 105, 220, 0.25);
    animation: glow 5s infinite alternate;
}

body::after {
    right: -160px;
    bottom: -160px;
    background: rgba(170, 80, 255, 0.25);
    animation: glow 6s infinite alternate-reverse;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

.title {
    font-size: clamp(42px, 10vw, 75px);
    font-weight: bold;
    margin-bottom: 20px;
    text-shadow:
        0 0 10px #ff8de1,
        0 0 25px #ff4fc3,
        0 0 45px #b700ff;
    animation: titleGlow 2.5s infinite alternate;
}

.intro-image {
    display: block;
    width: 100%;
    max-width: 650px;
    margin: 0 auto 25px;
    border-radius: 25px;
    box-shadow:
        0 0 20px rgba(255,255,255,0.3),
        0 0 45px rgba(255,79,195,0.7);
}

.slogan {
    min-height: 70px;
    max-width: 750px;
    margin: 20px auto 35px;
    font-size: clamp(20px, 4vw, 30px);
    font-weight: bold;
    line-height: 1.4;
    text-shadow:
        0 0 10px #ff8de1,
        0 0 25px #ff4fc3;
}

.card {
    max-width: 750px;
    margin: 25px auto;
    padding: 28px 22px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 28px;
    background: rgba(20,0,30,0.68);
    box-shadow: 0 0 30px rgba(255,79,195,0.25);
    backdrop-filter: blur(15px);
}

.progress-container {
    width: 100%;
    height: 10px;
    margin-bottom: 22px;
    overflow: hidden;
    border-radius: 20px;
    background: rgba(255,255,255,0.12);
}

.progress-bar {
    width: 0%;
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(90deg, #ff4fc3, #b700ff);
    box-shadow: 0 0 15px #ff4fc3;
    transition: width 0.4s ease;
}

.question-number {
    margin-bottom: 12px;
    font-size: 14px;
    opacity: 0.7;
}

.question {
    margin-bottom: 24px;
    font-size: clamp(21px, 4vw, 29px);
    font-weight: bold;
    line-height: 1.4;
}

.answers {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.answer,
.account-button,
.main-button {
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 20px;
    padding: 15px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: rgba(255,255,255,0.08);
    transition: 0.25s ease;
}

.answer:hover,
.account-button:hover,
.main-button:hover {
    transform: translateY(-2px) scale(1.02);
    background: rgba(255,79,195,0.28);
    box-shadow: 0 0 16px rgba(255,79,195,0.35);
}

.answer.correct {
    border-color: #6dffab;
    background: rgba(60,220,130,0.25);
}

.answer.wrong {
    border-color: #ff6688;
    background: rgba(255,60,100,0.25);
}

.account-section {
    max-width: 600px;
    margin: 30px auto 0;
    padding: 22px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 22px;
    background: rgba(255,255,255,0.06);
}

.account-title {
    margin-bottom: 8px;
    font-size: 19px;
    font-weight: bold;
}

.account-text {
    margin-bottom: 16px;
    font-size: 14px;
    line-height: 1.5;
    opacity: 0.78;
}

.account-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.account-button {
    padding: 12px 20px;
    background: rgba(255,79,195,0.16);
}

.account-status {
    min-height: 24px;
    margin-top: 14px;
    font-size: 14px;
    line-height: 1.5;
}

#clerkMount {
    display: none;
    margin-top: 20px;
    justify-content: center;
}

.result {
    display: none;
}

.result-score {
    margin: 15px 0;
    color: #ffb8ed;
    font-size: 52px;
    font-weight: bold;
    text-shadow: 0 0 20px #ff4fc3;
}

.wrong-review {
    display: none;
    margin-top: 20px;
    text-align: left;
}

.wrong-item {
    margin: 12px 0;
    padding: 15px;
    border-radius: 18px;
    background: rgba(255,255,255,0.08);
}

.wrong-item strong {
    color: #ff9be4;
}

.main-button {
    margin-top: 18px;
    padding: 13px 23px;
    border: none;
    background: linear-gradient(135deg, #ff4fc3, #9b35ff);
}

@keyframes glow {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.3);
    }
}

@keyframes titleGlow {
    from {
        text-shadow:
            0 0 10px #ff8de1,
            0 0 25px #ff4fc3;
    }

    to {
        text-shadow:
            0 0 20px #ffb8ed,
            0 0 45px #ff4fc3,
            0 0 70px #b700ff;
    }
}

@media (max-width: 600px) {
    body {
        padding-top: 28px;
    }

    .account-buttons {
        flex-direction: column;
    }

    .account-button {
        width: 100%;
    }

    .card {
        padding: 24px 17px;
    }
}
</style>
</head>

<body>

<main class="container">

    <div class="title">HerSafe 💜</div>

    <img
        class="intro-image"
        src="https://i.ibb.co/PGWJkKtV/34e700a0e1ee6be201f00704456bd3bb.jpg"
        alt="Football injury">

    <div id="slogan" class="slogan"></div>

    <section id="quizCard" class="card">

        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <div id="questionNumber" class="question-number"></div>

        <div id="question" class="question"></div>

        <div id="answers" class="answers"></div>

    </section>

    <section id="result" class="card result">

        <h2>Quiz Complete! 💜</h2>

        <div id="resultScore" class="result-score"></div>

        <div id="resultMessage"></div>

        <button
            id="wrongAnswersButton"
            class="main-button"
            type="button">
            See what answers you got wrong 💜
        </button>

        <div id="wrongReview" class="wrong-review"></div>

        <button
            id="homeButton"
            class="main-button"
            type="button">
            Continue to HerSafe 🏠
        </button>

    </section>

    <section id="accountSection" class="account-section">

        <div class="account-title">
            Save your HerSafe progress 💜
        </div>

        <div class="account-text">
            Create a HerSafe Pass or log in to save your quiz progress.
        </div>

        <div class="account-buttons">

            <button
                id="loginButton"
                class="account-button"
                type="button">
                👤 Log In
            </button>

            <button
                id="createButton"
                class="account-button"
                type="button">
                💜 Create HerSafe Pass
            </button>

        </div>

        <div id="clerkMount"></div>

        <div id="accountStatus" class="account-status"></div>

    </section>

</main>

<script src="hersafe-account.js"></script>

<script>
const sloganText =
    "Helping people understand, prevent and protect against leg injuries.";

let sloganIndex = 0;

function typeSlogan() {
    if (sloganIndex < sloganText.length) {
        document.getElementById("slogan").textContent +=
            sloganText.charAt(sloganIndex);

        sloganIndex++;

        setTimeout(typeSlogan, 45);
    }
}

const questions = [
    {
        question:
            "What should you do if you feel pain in your knee during football?",
        answers: [
            "Keep playing and ignore it.",
            "Stop and tell a responsible adult or coach.",
            "Run faster to see if it gets better.",
            "Wait until the next day before telling anyone."
        ],
        correct: 1
    },
    {
        question:
            "What can a proper warm-up help prepare?",
        answers: [
            "Your phone and equipment.",
            "Only your lungs.",
            "Your muscles and joints.",
            "Only your feet."
        ],
        correct: 2
    },
    {
        question:
            "Which can be a sign of a knee injury?",
        answers: [
            "Pain or swelling.",
            "Feeling hungry.",
            "Having clean football boots.",
            "Being thirsty before training."
        ],
        correct: 0
    },
    {
        question:
            "Why is wearing suitable football footwear important?",
        answers: [
            "It makes you run automatically.",
            "It makes your feet bigger.",
            "It can help provide grip and support.",
            "It prevents every possible injury."
        ],
        correct: 2
    },
    {
        question:
            "What is important after an injury?",
        answers: [
            "Ignore the injury.",
            "Get appropriate help and follow advice.",
            "Immediately return to full training.",
            "Hide the injury from your coach."
        ],
        correct: 1
    }
];

let currentQuestion = 0;
let score = 0;
let wrongAnswers = [];
let savedAnswers = {};

function loadQuestion() {
    const question = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;

    document.getElementById("question").textContent =
        question.question;

    const answersElement =
        document.getElementById("answers");

    answersElement.innerHTML = "";

    question.answers.forEach(function (answer, index) {
        const button = document.createElement("button");

        button.className = "answer";
        button.type = "button";
        button.textContent = answer;

        button.addEventListener("click", function () {
            selectAnswer(index);
        });

        answersElement.appendChild(button);
    });

    document.getElementById("progressBar").style.width =
        (currentQuestion / questions.length) * 100 + "%";
}

async function selectAnswer(index) {
    const question = questions[currentQuestion];
    const buttons = document.querySelectorAll(".answer");

    buttons.forEach(function (button) {
        button.disabled = true;
    });

    savedAnswers[currentQuestion] = {
        question: question.question,
        selected: index,
        selectedText: question.answers[index],
        correct: question.correct,
        correctText: question.answers[question.correct]
    };

    if (index === question.correct) {
        buttons[index].classList.add("correct");
        score++;
    } else {
        buttons[index].classList.add("wrong");
        buttons[question.correct].classList.add("correct");

        wrongAnswers.push({
            question: question.question,
            chosen: question.answers[index],
            correct: question.answers[question.correct]
        });
    }

    try {
        const user = await window.HerSafe.currentUser();

        if (user) {
            await window.HerSafe.saveProgress({
                answers: savedAnswers,
                completed: false
            });
        }
    } catch (error) {
        console.error("Progress save error:", error);
    }

    setTimeout(function () {
        currentQuestion++;

        if (currentQuestion < questions.length) {
            loadQuestion();
        } else {
            finishQuiz();
        }
    }, 900);
}

async function finishQuiz() {
    const percentage = Math.round(
        (score / questions.length) * 100
    );

    savedAnswers._score = percentage;
    savedAnswers._total = questions.length;
    savedAnswers._correct = score;

    try {
        const user = await window.HerSafe.currentUser();

        if (user) {
            await window.HerSafe.saveProgress({
                answers: savedAnswers,
                completed: true,
                completedCount: score,
                total: questions.length
            });
        }
    } catch (error) {
        console.error("Completed progress save error:", error);
    }

    localStorage.setItem("herSafeQuizCompleted", "true");
    localStorage.setItem("herSafeQuizScore", percentage);

    document.getElementById("quizCard").style.display = "none";
    document.getElementById("accountSection").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("resultScore").textContent =
        percentage + "%";

    document.getElementById("resultMessage").textContent =
        "You got " +
        score +
        " out of " +
        questions.length +
        " questions correct! 💜";
}

function showWrongAnswers() {
    const review = document.getElementById("wrongReview");

    review.style.display = "block";

    if (wrongAnswers.length === 0) {
        review.innerHTML =
            "<div class='wrong-item'>" +
            "🎉 You got every answer correct! 💜" +
            "</div>";

        return;
    }

    review.innerHTML =
        "<h3>Answers to look over:</h3>";

    wrongAnswers.forEach(function (item) {
        const itemElement = document.createElement("div");

        itemElement.className = "wrong-item";

        itemElement.innerHTML =
            "<strong>" +
            item.question +
            "</strong><br><br>" +
            "Your answer: " +
            item.chosen +
            "<br>" +
            "Correct answer: " +
            item.correct;

        review.appendChild(itemElement);
    });
}

/* ==========================================
   POPUP ACCOUNT BUTTONS
========================================== */

async function openAuth(mode) {
    const status =
        document.getElementById("accountStatus");

    const loginButton =
        document.getElementById("loginButton");

    const createButton =
        document.getElementById("createButton");

    status.textContent = "Opening HerSafe account... 💜";

    loginButton.disabled = true;
    createButton.disabled = true;

    try {
        const result =
            mode === "signup"
                ? await window.HerSafe.signUp()
                : await window.HerSafe.logIn();

        if (result === "modal") {
            status.textContent = "";
        } else if (result === "inline") {
            status.textContent =
                "Complete your account details below. 💜";
        } else {
            status.textContent =
                "The account form could not open. Please refresh.";
        }
    } catch (error) {
        console.error("Account popup error:", error);

        status.textContent =
            "The account form could not open. Please refresh and try again.";
    }

    loginButton.disabled = false;
    createButton.disabled = false;
}

document.getElementById("loginButton")
    .addEventListener("click", function () {
        openAuth("login");
    });

document.getElementById("createButton")
    .addEventListener("click", function () {
        openAuth("signup");
    });

document.getElementById("wrongAnswersButton")
    .addEventListener("click", showWrongAnswers);

document.getElementById("homeButton")
    .addEventListener("click", function () {
        window.location.href = "homepage101.html";
    });

typeSlogan();
loadQuestion();
</script>

</body>
</html>
