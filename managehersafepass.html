<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HerSafe Pass 💜</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, rgba(255, 80, 180, 0.25), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(140, 70, 255, 0.3), transparent 35%),
        linear-gradient(135deg, #16001f, #33004f, #14001c);
    color: white;
    text-align: center;
    padding: 30px;
}

.container {
    max-width: 600px;
    margin: 50px auto;
    padding: 30px 20px;
    border-radius: 22px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 0 20px rgba(255,79,195,0.12);
}

.logo {
    font-size: 42px;
    font-weight: bold;
    margin-bottom: 10px;
    text-shadow:
        0 0 10px #ff4fd8,
        0 0 25px #b84dff,
        0 0 45px #8c35ff;
}

h1 {
    font-size: clamp(28px, 5vw, 40px);
    margin: 12px 0 10px;
}

p {
    color: #ead9f5;
    line-height: 1.6;
    margin-bottom: 20px;
}

.page-actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 18px;
}

button {
    border: none;
    border-radius: 25px;
    padding: 12px 22px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    color: white;
    background: linear-gradient(135deg, #9d36ff, #ff42c8);
    box-shadow: 0 0 18px rgba(210, 60, 255, 0.3);
    transition: 0.3s;
}

button:hover {
    transform: scale(1.04);
}

#clerkMount {
    margin-top: 20px;
    display: block;
    text-align: center;
}

.account-status {
    min-height: 24px;
    margin-top: 18px;
    font-size: 14px;
    color: #dfffe9;
}

@media (max-width: 600px) {
    .container {
        margin: 30px 10px;
        padding: 24px 14px;
    }

    .page-actions {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="logo">HerSafe 💜</div>

    <h1 id="pageTitle">HerSafe Pass</h1>

    <p id="pageText">
        Sign in or create your account to save your progress.
    </p>

    <div id="clerkMount"></div>

    <div class="page-actions">
        <button id="homeButton" type="button">Back Home</button>
    </div>

    <div class="account-status" id="accountStatus"></div>

</div>

<script src="hersafe-account.js"></script>

<script>
/* =========================================
   GET MODE FROM URL
========================================= */

const params = new URLSearchParams(window.location.search);
const mode = params.get("mode") === "signup" ? "signup" : "login";

const pageTitle = document.getElementById("pageTitle");
const pageText = document.getElementById("pageText");
const accountStatus = document.getElementById("accountStatus");
const homeButton = document.getElementById("homeButton");

if (mode === "signup") {
    pageTitle.textContent = "Create HerSafe Pass 💜";
    pageText.textContent = "Create your account to keep your progress saved.";
} else {
    pageTitle.textContent = "Log in to HerSafe 💜";
    pageText.textContent = "Sign in to continue and save your progress.";
}

homeButton.addEventListener("click", function () {
    window.location.href = "homepage101.html";
});

/* =========================================
   OPEN AUTH MODAL
========================================= */

async function openChosenAuth() {
    try {
        await window.HerSafe.waitForClerk();

        if (mode === "signup") {
            await window.HerSafe.signUp();
        } else {
            await window.HerSafe.logIn();
        }

    } catch (error) {
        console.error("Auth failed:", error);

        accountStatus.textContent =
            "The sign-up / log-in window could not open. Please refresh and try again.";

        accountStatus.style.color = "#ffb6c1";
    }
}

window.addEventListener("load", function () {
    openChosenAuth();
});
</script>

</body>
</html>
